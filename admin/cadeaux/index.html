<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fidélité — Le Rebond</title>
<script>
// Les pages fidélité sont dans l'admin (onglet « Fidélité »). Le QR code des e-mails
// pointe ici avec ?j=<jeton> : on ouvre la fiche du client dans l'admin.
(function () {
    var j = new URLSearchParams(location.search).get('j');
    location.replace('https://le-rebond.fr/admin/?' + (j ? 'client=' + encodeURIComponent(j) : 'onglet=fidelite'));
})();
</script>
<meta http-equiv="refresh" content="1; url=https://le-rebond.fr/admin/?onglet=fidelite">
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px;color:#680920">Ouverture de l'admin…</body>
</html>
